
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-crossmatch"
version = "0.1.0"
description = "Library for astronomical catalog crossmatching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "astropy>=6.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
astrosearch-web = "app.web:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.setuptools.package-data]
app = ["*.yaml", "static/*.html"]
