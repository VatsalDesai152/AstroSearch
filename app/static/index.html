<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstroSearch</title>
  <style>
    :root { color-scheme: dark; --bg: #10131c; --panel: #191e2b; --line: #30394d; --text: #edf2ff; --muted: #aab5cc; --accent: #86b7ff; --danger: #ff9c9c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #1d3151, var(--bg) 48%); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100% - 32px, 980px); margin: 0 auto; padding: 52px 0 72px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -0.04em; }
    h2 { margin-top: 0; }
    .lede { max-width: 680px; color: var(--muted); margin: 0 0 28px; }
    .panel { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 18px 60px #0004; }
    form { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 14px; align-items: end; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: .9rem; }
    input { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #101521; color: var(--text); padding: 12px; font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { border: 0; border-radius: 10px; background: var(--accent); color: #07101f; padding: 12px 18px; font: 700 1rem inherit; cursor: pointer; white-space: nowrap; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 1.5em; margin: 16px 0 0; color: var(--muted); }
    #status.error { color: var(--danger); }
    #results { display: grid; gap: 18px; margin-top: 24px; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px 24px; color: var(--muted); }
    .group { border-top: 1px solid var(--line); padding-top: 18px; }
    .group h3 { margin: 0 0 8px; color: var(--accent); }
    ul { padding-left: 20px; margin: 0; }
    li { margin: 6px 0; }
    .warning { border-left: 3px solid var(--danger); padding: 10px 14px; background: #351f2b; color: #ffd7d7; }
    details { color: var(--muted); }
    pre { max-height: 360px; overflow: auto; padding: 14px; border-radius: 10px; background: #0c1018; font-size: .8rem; white-space: pre-wrap; }
    select { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #101521; color: var(--text); padding: 12px; font: inherit; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
    .toolbar input, .toolbar select { width: auto; min-width: 180px; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: .9rem; }
    th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); cursor: pointer; }
    a { color: var(--accent); }
    .group-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
    @media (max-width: 900px) { form { grid-template-columns: 1fr 1fr; } form button { grid-column: 1 / -1; } }
    @media (max-width: 460px) { form { grid-template-columns: 1fr; } form button { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <h1>AstroSearch</h1>
    <p class="lede">Cross-match a sky position against the configured astronomy catalogs. Enter coordinates in decimal degrees; RA wraps automatically and DEC must be between −90° and +90°.</p>
    <section class="panel" aria-labelledby="query-title">
      <h2 id="query-title">New cross-match</h2>
      <form id="query-form">
        <label>Right ascension (°)<input id="ra" name="ra" type="number" step="any" value="187.277920" required></label>
        <label>Declination (°)<input id="dec" name="dec" type="number" step="any" value="2.052390" required></label>
        <label>Radius (arcsec)<input id="radius" name="radius" type="number" min="0.001" step="any" value="3" required></label>
        <label>Epoch (Julian year)<input id="epoch" name="epoch" type="number" min="1800" max="2200" step="any" placeholder="optional"></label>
        <label>Profile<select id="profile" name="profile"><option value="full">Full</option><option value="optical">Optical</option><option value="infrared">Infrared</option><option value="stellar">Stellar</option><option value="extragalactic">Extragalactic</option><option value="radio">Radio</option><option value="xray">X-ray</option><option value="exoplanet">Exoplanet</option><option value="identity">Object identity</option></select></label>
        <button id="submit" type="submit">Search catalogs</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section id="results" aria-live="polite"></section>
  </main>
  <script>
    const form = document.querySelector('#query-form');
    const button = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');

    function text(tag, value, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = value;
      return element;
    }

    function renderResult(result) {
      results.replaceChildren();
      const summary = document.createElement('div');
      summary.className = 'summary';
      summary.append(text('span', `Target: ${result.target.ra}°, ${result.target.dec}°`));
      summary.append(text('span', `Catalogs queried: ${result.catalogs_queried}`));
      summary.append(text('span', `Matches: ${result.provenance.matches.length}`));
      results.append(summary);

      if (result.failures.length) results.append(text('div', `${result.failures.length} catalog(s) failed. Successful results are still shown.`, 'warning'));
      const allSources = Object.values(result.counterparts).flat();
      if (!allSources.length) results.append(text('p', 'No counterparts found within the requested radius.'));
      const toolbar = document.createElement('div');
      toolbar.className = 'toolbar';
      const filter = document.createElement('input');
      filter.placeholder = 'Filter catalog, ID, type…';
      const sort = document.createElement('select');
      sort.innerHTML = '<option value="separation_arcsec">Sort by separation</option><option value="confidence">Sort by confidence</option><option value="catalog">Sort by catalog</option><option value="source_id">Sort by source ID</option>';
      toolbar.append(filter, sort);
      results.append(toolbar);
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>Catalog</th><th>Source</th><th>Separation</th><th>Confidence</th><th>Physical data</th><th>Links</th></tr></thead>';
      const body = document.createElement('tbody');
      table.append(body);
      function renderRows() {
        const query = filter.value.toLowerCase();
        const rows = allSources.filter(source => `${source.catalog} ${source.source_id} ${JSON.stringify(source.physical || {})}`.toLowerCase().includes(query));
        rows.sort((a, b) => String(a[sort.value]).localeCompare(String(b[sort.value]), undefined, {numeric: true}));
        body.replaceChildren();
        for (const source of rows) {
          const row = document.createElement('tr');
          const physical = source.physical || {};
          const links = Object.entries(source.links || {}).map(([name, url]) => `<a href="${url}" target="_blank" rel="noreferrer">${name}</a>`).join(' · ');
          row.innerHTML = `<td>${source.catalog}</td><td><strong>${source.source_id}</strong><br><small>${physical.object_type || ''}</small></td><td>${Number(source.separation_arcsec).toFixed(3)} arcsec</td><td>${Number(source.confidence).toFixed(4)}</td><td>${physical.redshift ?? ''}${physical.parallax != null ? ` · parallax ${physical.parallax}` : ''}</td><td>${links}</td>`;
          body.append(row);
        }
      }
      filter.addEventListener('input', renderRows);
      sort.addEventListener('change', renderRows);
      renderRows();
      results.append(table);
      if (result.crossmatch_groups?.length) {
        const heading = text('h2', 'Cross-catalog objects');
        results.append(heading);
        for (const group of result.crossmatch_groups) {
          const card = document.createElement('div');
          card.className = 'group-card';
          card.append(text('strong', `${group.group_id} · ${group.catalogs.join(', ')}`));
          card.append(text('div', `${group.members.length} detections across ${group.wavelengths.join(', ')}`));
          results.append(card);
        }
      }
      if (result.failures.length) {
        const failureDetails = document.createElement('details');
        failureDetails.append(text('summary', 'Show catalog failures'));
        failureDetails.append(text('pre', JSON.stringify(result.failures, null, 2)));
        results.append(failureDetails);
      }
      const raw = document.createElement('details');
      raw.append(text('summary', 'Show raw response'));
      raw.append(text('pre', JSON.stringify(result, null, 2)));
      results.append(raw);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.className = '';
      status.textContent = 'Querying catalogs…';
      results.replaceChildren();
      try {
        const response = await fetch('/api/crossmatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ra: document.querySelector('#ra').value, dec: document.querySelector('#dec').value, radius_arcsec: document.querySelector('#radius').value, epoch: document.querySelector('#epoch').value || undefined, profile: document.querySelector('#profile').value })
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'The query failed.');
        status.textContent = 'Search complete.';
        renderResult(payload);
      } catch (error) {
        status.className = 'error';
        status.textContent = error.message || 'The query failed.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
