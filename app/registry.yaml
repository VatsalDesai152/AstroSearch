
catalogs:
  gaia_dr3:
    enabled: true
    provider: tap
    wavelength: optical
    endpoint: https://gea.esac.esa.int/tap-server/tap/sync
    table: gaiadr3.gaia_source
    description: Gaia DR3 TAP positional search
    query_method: ADQL
    units: degrees
    profiles: [full, optical, stellar]

  simbad:
    enabled: true
    provider: tap
    wavelength: multi
    endpoint: https://simbad.cds.unistra.fr/simbad/sim-tap/sync
    table: basic
    description: SIMBAD object identities, types, and measurements
    query_method: ADQL
    units: degrees
    parameters:
      columns: [main_id, ra, dec, otype, sp_type, plx_value, pmra, pmdec]
      id_field: main_id
      positional_error_field: err_pos
    profiles: [full, optical, stellar, identity]

  ned:
    enabled: true
    provider: tap
    wavelength: extragalactic
    endpoint: https://ned.ipac.caltech.edu/tap/sync
    table: objdir
    description: NASA/IPAC Extragalactic Database object directory
    query_method: ADQL
    units: degrees
    parameters:
      columns: [prefname, ra, dec, uncmaja, z, zflag, prefphytype]
      id_field: prefname
      positional_error_field: uncmaja
    profiles: [full, optical, extragalactic, identity]

  exoplanet_archive:
    enabled: true
    provider: tap
    wavelength: exoplanet
    endpoint: https://exoplanetarchive.ipac.caltech.edu/TAP/sync
    table: ps
    description: NASA Exoplanet Archive planetary systems
    query_method: ADQL
    units: degrees
    parameters:
      columns: [pl_name, hostname, ra, dec, discoverymethod, pl_orbper, pl_rade]
      id_field: pl_name
    profiles: [full, exoplanet, stellar]

  vizier_2mass_reference:
    enabled: false
    provider: tap
    wavelength: infrared
    endpoint: https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync
    table: II/246/out
    description: VizieR TAP example catalog entry; enable for published-catalog access
    query_method: ADQL
    units: degrees
    parameters:
      columns: [2MASS, RAJ2000, DEJ2000, Jmag, Hmag, Kmag]
      id_field: 2MASS
      ra_field: RAJ2000
      dec_field: DEJ2000
    profiles: [full, infrared, stellar]

  twomass_psc:
    enabled: true
    provider: irsa_gator
    wavelength: infrared
    catalog: fp_psc
    endpoint: https://irsa.ipac.caltech.edu/cgi-bin/Gator/nph-query
    description: 2MASS Point Source Catalog
    query_method: cone-search
    units: arcseconds
    profiles: [full, infrared, stellar]

  allwise:
    enabled: true
    provider: irsa_gator
    wavelength: infrared
    catalog: allwise_p3as_psd
    endpoint: https://irsa.ipac.caltech.edu/cgi-bin/Gator/nph-query
    description: AllWISE catalog
    query_method: cone-search
    units: arcseconds
    profiles: [full, infrared, stellar]

  panstarrs_dr2:
    enabled: true
    provider: mast
    wavelength: optical
    endpoint: https://catalogs.mast.stsci.edu/api/v0.1/panstarrs/dr2/mean
    description: Pan-STARRS DR2 mean object catalog
    query_method: positional API
    units: arcseconds
    profiles: [full, optical, extragalactic]

  sdss:
    enabled: true
    provider: sdss
    wavelength: optical
    endpoint: https://skyserver.sdss.org/dr18/SkyServerWS/ConeSearch/ConeSearchService
    description: Sloan Digital Sky Survey cone search
    query_method: cone-search
    units: arcseconds
    profiles: [full, optical, extragalactic, spectroscopy]

  first:
    enabled: true
    provider: heasarc_xamin
    wavelength: radio
    table: first
    endpoint: https://heasarc.gsfc.nasa.gov/xamin/query
    description: FIRST radio catalogue
    query_method: Xamin positional search
    units: arcseconds
    profiles: [full, radio, extragalactic]

  nvss:
    enabled: true
    provider: heasarc_xamin
    wavelength: radio
    table: nvss
    endpoint: https://heasarc.gsfc.nasa.gov/xamin/query
    description: NVSS radio catalogue
    query_method: Xamin positional search
    units: arcseconds
    profiles: [full, radio, extragalactic]

  vlass:
    enabled: true
    provider: heasarc_xamin
    wavelength: radio
    table: vlass
    endpoint: https://heasarc.gsfc.nasa.gov/xamin/query
    description: VLASS radio catalogue
    query_method: Xamin positional search
    units: arcseconds
    profiles: [full, radio, extragalactic]

  lotss:
    enabled: true
    provider: heasarc_xamin
    wavelength: radio
    table: lotss
    endpoint: https://heasarc.gsfc.nasa.gov/xamin/query
    description: LoTSS radio catalogue
    query_method: Xamin positional search
    units: arcseconds
    profiles: [full, radio, extragalactic]

  rosat:
    enabled: true
    provider: heasarc_xamin
    wavelength: xray
    table: rosmaster
    endpoint: https://heasarc.gsfc.nasa.gov/xamin/query
    description: ROSAT all-sky survey master catalog
    query_method: Xamin positional search
    units: arcseconds
    profiles: [full, xray, high-energy]

  chandra:
    enabled: true
    provider: heasarc_xamin
    wavelength: xray
    table: chandra
    endpoint: https://heasarc.gsfc.nasa.gov/xamin/query
    description: Chandra source catalogue
    query_method: Xamin positional search
    units: arcseconds
    profiles: [full, xray, high-energy]

  xmm:
    enabled: true
    provider: heasarc_xamin
    wavelength: xray
    table: xmm
    endpoint: https://heasarc.gsfc.nasa.gov/xamin/query
    description: XMM source catalogue
    query_method: Xamin positional search
    units: arcseconds
    profiles: [full, xray, high-energy]
